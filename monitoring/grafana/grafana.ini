# Copy outside the checkout and replace /ABS/MONITORING. See GRAFANA.md.
[paths]
data = /ABS/MONITORING/grafana/data
logs = /ABS/MONITORING/grafana/logs
plugins = /ABS/MONITORING/grafana/plugins
provisioning = /ABS/MONITORING/grafana/provisioning

[server]
http_addr = 127.0.0.1
http_port = 3000

[analytics]
reporting_enabled = false
check_for_updates = false
check_for_plugin_updates = false

[security]
# Native Grafana reads secrets with its file provider. Docker's __FILE variables are launcher-specific.
# Create this owner-only file before startup; a missing file must fail instead of using admin/admin.
admin_password = $__file{/ABS/MONITORING/grafana/secrets/admin-password}
disable_gravatar = true
cookie_samesite = strict

[users]
allow_sign_up = false
allow_org_create = false

[auth.anonymous]
enabled = false

[snapshots]
external_enabled = false

[plugins]
preinstall_disabled = true

[unified_alerting]
# Prometheus owns rule evaluation; no duplicate Grafana rule engine.
enabled = false
