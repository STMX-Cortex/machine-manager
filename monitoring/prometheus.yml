# Central collector: local machine plus peers from its fleet.json. See MONITORING.md.
global:
  scrape_interval: 15s
  scrape_timeout: 5s
  evaluation_interval: 15s

rule_files:
  - machine-manager.rules.yml

scrape_configs:
  - job_name: machine-manager
    metrics_path: /metrics
    scheme: http
    follow_redirects: false
    honor_labels: false
    # Fleet storage adds at most 33 machines x (128 filesystems x 7 + 128 devices x 5) = 50688 series to the
    # resource maximum (1000 records x 75). Bodies stay within mm serve's 16 MiB response cap; see METRICS.md.
    sample_limit: 200000
    body_size_limit: 16MB
    label_limit: 16
    label_name_length_limit: 128
    label_value_length_limit: 512
    static_configs:
      - targets: ['127.0.0.1:9877']
