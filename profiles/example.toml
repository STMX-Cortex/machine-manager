# machine-manager EXAMPLE profile: every section, with made-up paths. Copy it, keep what you need, delete the rest.
# Only `name` is required. A section left out turns its part off (README.md, "Profile").
# The tool reads this file and never writes it. Thresholds are settings (settings.default.toml), not profile values.

name = "example"
# machine_id = "build-mac-1"         # default: the host name

[names]                              # words used in alert texts
owner = "the owner"
recipient = "the build agent"
trim_command = "QUEUE_EXCLUSIVE_OK=1 /opt/example/queue/run-queued.py --exclusive -- /opt/example/bin/trim-cache 360"
disk_command = "/opt/example/bin/disk-cleanup"   # DISK_LOW and CLEANUP_LIST name it (default: none; CLEANUP_LIST then says mm cleanup)
jobs_file = "/opt/example/agent/state.md"

[service]
label_prefix = "com.example.machine-manager"   # LaunchAgents: <prefix> and <prefix>-watchdog
rollback_notes = ["restart your old memory guard by hand: /opt/example/bin/memguard start"]

[sizes]                              # folders sized every 30 min; `cache` is the trim's cache
cache = "/opt/example/cache/go-build"
worktrees = "/opt/example/worktrees"

[live_tools]                         # a live build, found by process NAME only (never by command text)
names = ["go", "test2json"]
suffixes = [".test"]
path_regexes = ["/go-build[0-9]+/"]

[memory_guard]                       # a separate memory guard process with a heartbeat file (optional)
state_file = "/opt/example/memguard/state.json"
heartbeat_key = "heartbeat_epoch"
pid_key = "pid"
kills_log = "/opt/example/memguard/kills.log"
max_age_s = 60

[queue]                              # a slot queue of flock'ed files (adapter fifo-gates)
adapter = "fifo-gates"
dir = "/opt/example/queue"
launcher = "run-queued.py"
exclusive_env = { QUEUE_EXCLUSIVE_OK = "1" }
wide_mode_kind = "merge-wide"
exclusive_mode_kind = "timing-rerun"
kind_patterns = [["\\bgo test\\b", "go-test"], ["pytest", "py-suite"]]

[kinds]                              # job kinds for `mm place`
wide = "merge-wide"
[kinds.machine_only]                 # never on a pool, with the reason
merge-wide = "the merge run stays on this machine"
other = "kind 'other' runs on this machine"
[kinds.pool]                         # may run on the pool, with its largest shard count
go-test = 8
py-suite = 32

[ci]                                 # GitHub Actions read through gh (adapter github-gh); read-only
adapter = "github-gh"
pool_id = "github-actions:example-org/example-repo"
repo = "example-org/example-repo"
billing_path = "/organizations/example-org/settings/billing/usage"
guard_argv = ["/opt/example/bin/ci-budget", "guard"]   # exit 0 fits, 1 refused, 2 cannot read
guard_args = { default = ["--kind", "go-test", "--shards", "{shards}", "--race", "{race}", "--packages", "{packages}"], py-suite = ["--kind", "py-suite", "--shards", "{shards}"] }   # placeholders: {kind} {shards} {race} {packages} {crate} {diff_base}
guard_defaults = { packages = "./..." }
job_minutes = 40
plan_minutes = 2
dispatch_kinds = ["go-test"]
push_command = "git push origin {sha}:refs/heads/{branch}"
dispatch_argv = ["/opt/example/bin/ci-dispatch", "--branch", "{branch}"]
scratch_command = "/opt/example/bin/make-scratch {branch}"
noise = [{ workflow_regex = "^probe" }]

[delivery]                           # warnings into one Claude Code session (adapter claude-code-hook)
adapter = "claude-code-hook"
recipient_file = "/opt/example/agent/state.md"
recipient_regex = "Session: ([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})"
jobs_file = "/opt/example/agent/state.md"
jobs_end_marker = "<!-- end -->"
jobs_base = "/opt/example"
transcripts_dir = "~/.claude/projects/-opt-example"
usage_state = "/opt/example/usage/state.json"
investigator = ".claude/agents/investigator.md"
launch_tools = ["Agent", "Task", "Workflow"]
launch_bash_regex = "(^|[;&|(]\\s*)(\\S*/)?(codex|claude)(\\s|$)"
settings_file = "/opt/example/.claude/settings.local.json"

[trim]                               # the guarded cache trim (an exclusive queue call)
cache = "/opt/example/cache/go-build"
marker_file = "README"
marker_text = "Go build"
warm_argv = ["/opt/example/bin/warm-cache", "{cache}"]

[deletes]                            # SAFE-AUTO deletes (settings deletes.enabled) and the cleanup list
forbidden_parts = [".ssh", ".gnupg"]
protected_roots = ["/opt/example/repo"]

[[deletes.rules]]
id = "S1"
type = "own_files"
files = ["metrics.csv.1", "alerts.jsonl.1", "deletes.log.1"]

[[deletes.rules]]
id = "S2"
type = "folders"
roots = ["{user_tmp}", "/private/tmp"]
patterns = ["go-build*", "go-link*"]
dirs_only = true
age_minutes = 360
no_live_tools = true

[[deletes.rules]]
id = "S5"
type = "cache_entries"
cache = "~/Library/Caches/go-build"
marker_file = "README"
marker_text = "Go build"
age_minutes = 2880
no_live_tools = true

[[deletes.cleanup]]
id = "R1"
type = "git_worktrees"
repo = "/opt/example/repo"
roots = ["/opt/example/worktrees"]
merged_into = "origin/main"

[recovery]                           # after a Mac reboot, MAC_REBOOTED names each expected job that is not running
expected_jobs = [
  { name = "memory guard", match = "memguard\\.py run" },
  { name = "load sampler", match = "/opt/example/queue/sample_load\\.sh" },
]
