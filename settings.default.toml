# machine-manager default settings. Do not edit this file: put changed values in settings.toml in the data folder
# (only the keys you change). `mm check` validates them; the tool reads them each tick and never writes them.

[mode]
# How much the tool may do. Observe mode: readings and alerts only; every action logs a WOULD line.
slot_writes = "off"  # off|test|live
slots_file = ""  # path
observe = true  # bool

[slots]
# The machine state (GREEN, STEADY, AMBER, RED) and the slot controller of the job queue.
floor = 2  # slots
ceiling = 8  # slots
raise_green_minutes = 15  # min of GREEN while enough calls wait and all slots stay busy
raise_requires_waiting = 1  # calls
hold_after_red_minutes = 30  # min
hold_after_trim_minutes = 30  # min
amber_step_interval_s = 120  # s
green_free_pct = 55  # %
green_load5 = 8  # load
green_load1_per_core = 0.8  # x cores; range 0.1-4
green_sys_pct = 25  # %
amber_free_pct = 50  # %
amber_swap_growth_mb_30m = 100  # MB
amber_comp_mb = 5120  # MB
amber_load5 = 14  # load
amber_sys_pct = 30  # %
red_free_pct = 35  # %
red_swap_growth_mb_60s = 512  # MB
red_comp_growth_mb_60s = 1024  # MB
red_segments_pct = 70  # % of vm.compressor.segment.limit
red_swap_used_of_total_pct = 90  # %
red_sys_pct = 40  # % in 2 samples
red_load1_per_core = 2.0  # x cores
red_disk_gb = 20  # GB
sustain_samples = 2  # samples
cores = 0  # cores; 0 = the machine's core count

[launch_gate]
# Deny new agent launches while the machine is RED (the hook; fail-open when the tool is stale).
enabled = false  # bool
max_minutes = 5  # min

[pause_newest_call]
# Stop (SIGSTOP) the newest queue call at a critical RED; continue it after GREEN.
enabled = false  # bool
resume_after_green_s = 120  # s
# The time limit of the lsof that finds the processes holding the newest call's slot file (a failed lsof pauses nothing).
lsof_timeout_s = 10  # s

[disk]
# Free disk space and the build cache size.
low_gb = 40  # GB
recover_gb = 45  # GB
trend_hours = 6  # h
cache_attention_gb = 30  # GB
cache_action_gb = 45  # GB
cache_action_disk_gb = 50  # GB
sizes_interval_minutes = 30  # min between two size reads of the profile's [sizes] folders

[usage]
# Agent plan usage (read from a usage state file by the delivery adapter).
codex_attention_pct = 95  # %
codex_action_pct = 98  # %
claude_action_pct = 98  # % weekly or 5-hour
claude_projection_pct = 95  # %
claude_5h_attention_pct = 85  # %
watch_state_max_age_s = 1800  # s
read_clock_allowance_s = 5  # s; tolerate small clock differences in a row's read_at (0..60)

[queue]
# The job queue: waits, long calls, placement.
wait_minutes = 20  # min
waits_over_20_per_hour = 3  # calls
long_call_minutes = 20  # min
head_block_minutes = 10  # min
slot_cpu_cores = 4  # cores per held slot, per call, for 2 readings
placement_max_mac_wait_minutes = 20  # min
wide_free_pct = 50  # %
idle_room_minutes = 30  # min
default_run_minutes = 10  # min

[github]
# The CI pool (GitHub Actions): minutes, money, stuck runs.
included_minutes = 3000  # min/month
allowed_gross_usd = 0  # USD
near_minutes = 2400  # min
pace_minutes = 2700  # min/month pace
reserve_minutes = 300  # min
stuck_queued_minutes = 45  # min
stuck_running_minutes = 170  # min
read_interval_s = 600  # s
stale_minutes = 30  # min
near_gross_pct = 85  # % of allowed gross
stop_minutes = 3000  # min
watch_interval_s = 120  # s
done_alert_minutes = 60  # min

[other]
# Other alert limits.
fseventsd_mb = 1000  # MB
cache_5m_share_pct = 10  # %
cache_5m_min_tokens_m = 1  # M tokens
recipient_tool_wait_minutes = 12  # min
load_log_max_age_s = 180  # s
heartbeat_max_age_s = 90  # s
resume_gap_s = 300  # s

[repeat]
# How often an active alert repeats, and when it clears.
action_minutes = 30  # min
attention_hours = 3  # h
clear_after_minutes = 5  # min

[banner]
# A macOS notification for each ACTION alert.
enabled = false  # bool

[hook]
# The session hook.
log_input_keys = false  # bool
remind_waiter_minutes = 60  # min
# A subagent's compaction calls SessionStart with the recipient's session id and no agent_id; only its model is its
# own. The hook compares that model with the models of the recipient's newest replies, read back from the end of its
# transcript.
subagent_model_replies = 20  # replies
subagent_model_scan_mb = 16  # MB

[deletes]
# Automatic deletes of safe, space-only files (the profile names the rules).
enabled = false  # bool
interval_minutes = 180  # min
lsof_timeout_s = 30  # s
evidence_keep_days = 7  # days
cleanup_list_hours = 24  # h

[trim]
# The guarded build cache trim (an exclusive queue call).
age_minutes = 360  # min
wait_s = 60  # s
drained_minutes = 2  # min
needed_after_minutes = 60  # min

[evidence]
# Evidence bundles for an investigator.
slots = 20  # bundles
window_minutes = 30  # min

[self]
# The tool's check of itself and its recovery (restart, crash-loop guard, safe mode).
max_rss_mb = 200  # MB of its own memory; above it, a restart
max_tick_s = 30  # s per tick
slow_ticks = 3  # ticks in a row over max_tick_s; then a restart
bad_reading_ticks = 6  # ticks in a row with wrong readings (safe mode) or failed ticks (a restart)
min_free_mb = 200  # MB free on the data folder's disk; below it, safe mode
max_slot_changes_per_hour = 12  # changes; above it, safe mode
crash_loop_starts = 3  # unclean starts inside crash_loop_minutes; then safe mode
crash_loop_minutes = 15  # min
watchdog_stale_s = 180  # s without a watchdog run; then an alert and a restart of the watchdog
resume_paused_after_s = 120  # s of a stale supervisor; then the watchdog continues every paused process
restart_wait_s = 30  # s that `mm restart` waits for a fresh heartbeat
start_grace_s = 90  # s after a start or a load in which the watchdog neither restarts the supervisor nor alerts
stop_deadline_s = 8  # s from a SIGTERM to the forced end of a tick that does not end (under launchd's ExitTimeOut 20)

[safe_mode]
# Safe mode: automatic actions off, the slot count once lowered to at most this value; readings and alerts go on.
slots = 5  # slots

[heartbeat]
# An outside dead-man ping (off when url is empty): a GET every every_min minutes. No network unless set.
url = ""  # https URL
every_min = 5  # min
timeout_s = 10  # s
